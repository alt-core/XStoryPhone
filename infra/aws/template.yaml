AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: XStoryPhoneのAWSサーバーレス構成

Parameters:
  ProjectName:
    Type: String
    Default: xstoryphone
    AllowedPattern: '^[a-z][a-z0-9-]{0,23}$'
  WebAclArn:
    Type: String
    Default: ""
  EnvironmentName:
    Type: String
    AllowedValues: [dev, stg, prod]
  AllowedOrigins:
    Type: String
    Default: ""
  AdminReviewSecret:
    Type: String
    NoEcho: true
    MinLength: 1
  BrowserStateSecret:
    Type: String
    NoEcho: true
    Default: ""
  AccessCodeSecret:
    Type: String
    NoEcho: true
    Default: ""
  PlayerInputLogging:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  LlmApiKey:
    Type: String
    NoEcho: true
    Default: ""
  LlmModel:
    Type: String
    Default: ""
  LlmBaseUrl:
    Type: String
    Default: ""
  LlmTimeoutMs:
    Type: String
    Default: ""
  LlmReasoningEffort:
    Type: String
    Default: ""
  LlmProfileFastModel:
    Type: String
    Default: ""
  LlmProfileFastReasoningEffort:
    Type: String
    Default: ""
  LlmProfileFastTimeoutMs:
    Type: String
    Default: ""
  LlmProfileSuperModel:
    Type: String
    Default: ""
  LlmProfileSuperReasoningEffort:
    Type: String
    Default: ""
  LlmProfileSuperTimeoutMs:
    Type: String
    Default: ""
  LlmProfileUltraModel:
    Type: String
    Default: ""
  LlmProfileUltraReasoningEffort:
    Type: String
    Default: ""
  LlmProfileUltraTimeoutMs:
    Type: String
    Default: ""
  LlmAnalyticsEnabled:
    Type: String
    AllowedValues: ["", "true", "false"]
    Default: ""
  LlmDebugLogs:
    Type: String
    AllowedValues: ["", "true", "false"]
    Default: ""
  LlmResultRetentionDays:
    Type: String
    Default: ""
  LlmHookMaxRequests:
    Type: Number
    Default: 5
    MinValue: 1
  LlmTalkSelector:
    Type: String
    Default: ""
  TypesafeApiKey:
    Type: String
    NoEcho: true
    Default: ""
  TypesafeModel:
    Type: String
    Default: ""
  TypesafeMinConfidence:
    Type: String
    Default: ""
  TypesafeGameOverMinConfidence:
    Type: String
    Default: ""
  ReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  AppTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${EnvironmentName}-api
      Runtime: nodejs22.x
      Architectures: [arm64]
      CodeUri: ../../
      Handler: src/platform/aws/handler.handler
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          TABLE_NAME: !Ref AppTable
          ADMIN_REVIEW_SECRET: !Ref AdminReviewSecret
          BROWSER_STATE_SECRET: !Ref BrowserStateSecret
          ACCESS_CODE_SECRET: !Ref AccessCodeSecret
          PLAYER_INPUT_LOGGING: !Ref PlayerInputLogging
          LLM_API_KEY: !Ref LlmApiKey
          LLM_MODEL: !Ref LlmModel
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_TIMEOUT_MS: !Ref LlmTimeoutMs
          LLM_REASONING_EFFORT: !Ref LlmReasoningEffort
          LLM_PROFILE_FAST_MODEL: !Ref LlmProfileFastModel
          LLM_PROFILE_FAST_REASONING_EFFORT: !Ref LlmProfileFastReasoningEffort
          LLM_PROFILE_FAST_TIMEOUT_MS: !Ref LlmProfileFastTimeoutMs
          LLM_PROFILE_SUPER_MODEL: !Ref LlmProfileSuperModel
          LLM_PROFILE_SUPER_REASONING_EFFORT: !Ref LlmProfileSuperReasoningEffort
          LLM_PROFILE_SUPER_TIMEOUT_MS: !Ref LlmProfileSuperTimeoutMs
          LLM_PROFILE_ULTRA_MODEL: !Ref LlmProfileUltraModel
          LLM_PROFILE_ULTRA_REASONING_EFFORT: !Ref LlmProfileUltraReasoningEffort
          LLM_PROFILE_ULTRA_TIMEOUT_MS: !Ref LlmProfileUltraTimeoutMs
          LLM_ANALYTICS_ENABLED: !Ref LlmAnalyticsEnabled
          LLM_DEBUG_LOGS: !Ref LlmDebugLogs
          LLM_RESULT_RETENTION_DAYS: !Ref LlmResultRetentionDays
          LLM_HOOK_MAX_REQUESTS: !Ref LlmHookMaxRequests
          LLM_TALK_SELECTOR: !Ref LlmTalkSelector
          TYPESAFE_API_KEY: !Ref TypesafeApiKey
          TYPESAFE_MODEL: !Ref TypesafeModel
          TYPESAFE_MIN_CONFIDENCE: !Ref TypesafeMinConfidence
          TYPESAFE_GAME_OVER_MIN_CONFIDENCE: !Ref TypesafeGameOverMinConfidence
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AppTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api
            Method: ANY
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/{proxy+}
            Method: ANY
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/platform/aws/handler.ts
        External:
          - "@aws-sdk/client-dynamodb"
        Format: cjs
        Minify: true
        Sourcemap: false
        Target: es2022

  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppFunction}
      RetentionInDays: !Ref LogRetentionDays

  StaticBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-${EnvironmentName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: 拡張子のない画面URLをindex.htmlへ解決する
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri !== "/" && request.uri.indexOf(".") === -1) {
            request.uri = "/index.html";
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: StaticOrigin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: StaticOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  StaticBucketName:
    Value: !Ref StaticBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref AppTable
  ApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
