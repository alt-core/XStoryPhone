AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: XStoryPhoneのAWSサーバーレス構成

Parameters:
  ProjectName:
    Type: String
    Default: xstoryphone
    AllowedPattern: '^[a-z][a-z0-9-]{0,23}$'
  WebAclArn:
    Type: String
    Default: ""
  EnvironmentName:
    Type: String
    AllowedValues: [dev, stg, prod]
  AllowedOrigins:
    Type: String
    Default: ""
  AdminReviewSecret:
    Type: String
    NoEcho: true
    MinLength: 1
  BrowserStateSecret:
    Type: String
    NoEcho: true
    Default: ""
  AccessCodeSecret:
    Type: String
    NoEcho: true
    Default: ""
  PlayerInputLogging:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  LlmApiKey:
    Type: String
    NoEcho: true
    Default: ""
  LlmModel:
    Type: String
    Default: ""
  LlmBaseUrl:
    Type: String
    Default: ""
  LlmTimeoutMs:
    Type: String
    Default: ""
  LlmReasoningEffort:
    Type: String
    Default: ""
  LlmProfileFastModel:
    Type: String
    Default: ""
  LlmProfileFastReasoningEffort:
    Type: String
    Default: ""
  LlmProfileFastTimeoutMs:
    Type: String
    Default: ""
  LlmProfileSuperModel:
    Type: String
    Default: ""
  LlmProfileSuperReasoningEffort:
    Type: String
    Default: ""
  LlmProfileSuperTimeoutMs:
    Type: String
    Default: ""
  LlmProfileUltraModel:
    Type: String
    Default: ""
  LlmProfileUltraReasoningEffort:
    Type: String
    Default: ""
  LlmProfileUltraTimeoutMs:
    Type: String
    Default: ""
  LlmAnalyticsEnabled:
    Type: String
    AllowedValues: ["", "true", "false"]
    Default: ""
  LlmDebugLogs:
    Type: String
    AllowedValues: ["", "true", "false"]
    Default: ""
  LlmResultRetentionDays:
    Type: String
    Default: ""
  LlmHookMaxRequests:
    Type: Number
    Default: 5
    MinValue: 1
  LlmTalkSelector:
    Type: String
    Default: ""
  TypesafeApiKey:
    Type: String
    NoEcho: true
    Default: ""
  TypesafeModel:
    Type: String
    Default: ""
  TypesafeMinConfidence:
    Type: String
    Default: ""
  TypesafeAdvanceMinConfidence:
    Type: String
    Default: ""
  TypesafeGameOverMinConfidence:
    Type: String
    Default: ""
  TypesafeLowConfidenceFallback:
    Type: String
    Default: ""
  CodeBucketName:
    Type: String
    MinLength: 1
  CodeObjectKey:
    Type: String
    AllowedPattern: '^releases/.+$'
  CodeObjectVersion:
    Type: String
    MinLength: 1
  MaxEnvironments:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 10000
  MaxConcurrencyPerEnvironment:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 128
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]
  HasAllowedOrigins: !Not [!Equals [!Ref AllowedOrigins, ""]]
  HasBrowserStateSecret: !Not [!Equals [!Ref BrowserStateSecret, ""]]
  HasAccessCodeSecret: !Not [!Equals [!Ref AccessCodeSecret, ""]]
  HasLlmApiKey: !Not [!Equals [!Ref LlmApiKey, ""]]
  HasLlmModel: !Not [!Equals [!Ref LlmModel, ""]]
  HasLlmBaseUrl: !Not [!Equals [!Ref LlmBaseUrl, ""]]
  HasLlmTimeoutMs: !Not [!Equals [!Ref LlmTimeoutMs, ""]]
  HasLlmReasoningEffort: !Not [!Equals [!Ref LlmReasoningEffort, ""]]
  HasLlmProfileFastModel: !Not [!Equals [!Ref LlmProfileFastModel, ""]]
  HasLlmProfileFastReasoningEffort: !Not [!Equals [!Ref LlmProfileFastReasoningEffort, ""]]
  HasLlmProfileFastTimeoutMs: !Not [!Equals [!Ref LlmProfileFastTimeoutMs, ""]]
  HasLlmProfileSuperModel: !Not [!Equals [!Ref LlmProfileSuperModel, ""]]
  HasLlmProfileSuperReasoningEffort: !Not [!Equals [!Ref LlmProfileSuperReasoningEffort, ""]]
  HasLlmProfileSuperTimeoutMs: !Not [!Equals [!Ref LlmProfileSuperTimeoutMs, ""]]
  HasLlmProfileUltraModel: !Not [!Equals [!Ref LlmProfileUltraModel, ""]]
  HasLlmProfileUltraReasoningEffort: !Not [!Equals [!Ref LlmProfileUltraReasoningEffort, ""]]
  HasLlmProfileUltraTimeoutMs: !Not [!Equals [!Ref LlmProfileUltraTimeoutMs, ""]]
  HasLlmAnalyticsEnabled: !Not [!Equals [!Ref LlmAnalyticsEnabled, ""]]
  HasLlmDebugLogs: !Not [!Equals [!Ref LlmDebugLogs, ""]]
  HasLlmResultRetentionDays: !Not [!Equals [!Ref LlmResultRetentionDays, ""]]
  HasLlmTalkSelector: !Not [!Equals [!Ref LlmTalkSelector, ""]]
  HasTypesafeApiKey: !Not [!Equals [!Ref TypesafeApiKey, ""]]
  HasTypesafeModel: !Not [!Equals [!Ref TypesafeModel, ""]]
  HasTypesafeMinConfidence: !Not [!Equals [!Ref TypesafeMinConfidence, ""]]
  HasTypesafeAdvanceMinConfidence: !Not [!Equals [!Ref TypesafeAdvanceMinConfidence, ""]]
  HasTypesafeGameOverMinConfidence: !Not [!Equals [!Ref TypesafeGameOverMinConfidence, ""]]
  HasTypesafeLowConfidenceFallback: !Not [!Equals [!Ref TypesafeLowConfidenceFallback, ""]]

Resources:
  AppTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${ProjectName}-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true

  AppFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppFunctionRolePolicy0
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:DescribeTable
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt AppTable.Arn
                  - !Sub ${AppTable.Arn}/index/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt AppWebFunctionLogGroup.Arn
                  - !GetAtt AppWebFunctionLocalLogGroup.Arn

  AppWebFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/web/${ProjectName}-${EnvironmentName}-web-api
      RetentionInDays: !Ref LogRetentionDays

  AppWebFunctionLocalLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/web/${ProjectName}-${EnvironmentName}-web-api.local
      RetentionInDays: !Ref LogRetentionDays

  AppWebFunction:
    Type: AWS::Serverless::WebFunction
    # SAMが生成するEndpointはRevisionをGetAttで参照し、同じRevisionをDependsOnにも列挙する。
    # 依存関係は既に満たされるため動作への影響はなく、手書きの設定では重複を除去できない。
    # lint時はMetadataが本体・Revision・Endpointへ伝播し、この範囲のW3005だけを除外する。
    # 他資源のW3005と、この3資源の他ルールは引き続き検査する。
    # SAM側で重複生成が解消されたら、このMetadataと注記を削除する。
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3005
    Properties:
      FunctionName: !Sub ${ProjectName}-${EnvironmentName}-web-api
      Runtime: nodejs24.x
      EntryPoint: index.cjs
      CodeUri:
        Bucket: !Ref CodeBucketName
        Key: !Ref CodeObjectKey
        Version: !Ref CodeObjectVersion
      ExecutionRoleArn: !GetAtt AppFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref AppWebFunctionLogGroup
      Timeout: 30
      MaxConcurrencyPerEnvironment: !Ref MaxConcurrencyPerEnvironment
      ScalingConfig:
        MaxEnvironments: !Ref MaxEnvironments
      AuthType: IamAuth
      EndpointType: HomeRegion
      EndpointName: !Ref EnvironmentName
      AutoDeploymentMode: LatestRevision
      EnvironmentVariables:
        APP_ENV: !Ref EnvironmentName
        ALLOWED_ORIGINS: !If [HasAllowedOrigins, !Ref AllowedOrigins, !Ref AWS::NoValue]
        TABLE_NAME: !Ref AppTable
        ADMIN_REVIEW_SECRET: !Ref AdminReviewSecret
        BROWSER_STATE_SECRET: !If [HasBrowserStateSecret, !Ref BrowserStateSecret, !Ref AWS::NoValue]
        ACCESS_CODE_SECRET: !If [HasAccessCodeSecret, !Ref AccessCodeSecret, !Ref AWS::NoValue]
        PLAYER_INPUT_LOGGING: !Ref PlayerInputLogging
        LLM_API_KEY: !If [HasLlmApiKey, !Ref LlmApiKey, !Ref AWS::NoValue]
        LLM_MODEL: !If [HasLlmModel, !Ref LlmModel, !Ref AWS::NoValue]
        LLM_BASE_URL: !If [HasLlmBaseUrl, !Ref LlmBaseUrl, !Ref AWS::NoValue]
        LLM_TIMEOUT_MS: !If [HasLlmTimeoutMs, !Ref LlmTimeoutMs, !Ref AWS::NoValue]
        LLM_REASONING_EFFORT: !If [HasLlmReasoningEffort, !Ref LlmReasoningEffort, !Ref AWS::NoValue]
        LLM_PROFILE_FAST_MODEL: !If [HasLlmProfileFastModel, !Ref LlmProfileFastModel, !Ref AWS::NoValue]
        LLM_PROFILE_FAST_REASONING_EFFORT: !If [HasLlmProfileFastReasoningEffort, !Ref LlmProfileFastReasoningEffort, !Ref AWS::NoValue]
        LLM_PROFILE_FAST_TIMEOUT_MS: !If [HasLlmProfileFastTimeoutMs, !Ref LlmProfileFastTimeoutMs, !Ref AWS::NoValue]
        LLM_PROFILE_SUPER_MODEL: !If [HasLlmProfileSuperModel, !Ref LlmProfileSuperModel, !Ref AWS::NoValue]
        LLM_PROFILE_SUPER_REASONING_EFFORT: !If [HasLlmProfileSuperReasoningEffort, !Ref LlmProfileSuperReasoningEffort, !Ref AWS::NoValue]
        LLM_PROFILE_SUPER_TIMEOUT_MS: !If [HasLlmProfileSuperTimeoutMs, !Ref LlmProfileSuperTimeoutMs, !Ref AWS::NoValue]
        LLM_PROFILE_ULTRA_MODEL: !If [HasLlmProfileUltraModel, !Ref LlmProfileUltraModel, !Ref AWS::NoValue]
        LLM_PROFILE_ULTRA_REASONING_EFFORT: !If [HasLlmProfileUltraReasoningEffort, !Ref LlmProfileUltraReasoningEffort, !Ref AWS::NoValue]
        LLM_PROFILE_ULTRA_TIMEOUT_MS: !If [HasLlmProfileUltraTimeoutMs, !Ref LlmProfileUltraTimeoutMs, !Ref AWS::NoValue]
        LLM_ANALYTICS_ENABLED: !If [HasLlmAnalyticsEnabled, !Ref LlmAnalyticsEnabled, !Ref AWS::NoValue]
        LLM_DEBUG_LOGS: !If [HasLlmDebugLogs, !Ref LlmDebugLogs, !Ref AWS::NoValue]
        LLM_RESULT_RETENTION_DAYS: !If [HasLlmResultRetentionDays, !Ref LlmResultRetentionDays, !Ref AWS::NoValue]
        LLM_HOOK_MAX_REQUESTS: !Ref LlmHookMaxRequests
        LLM_TALK_SELECTOR: !If [HasLlmTalkSelector, !Ref LlmTalkSelector, !Ref AWS::NoValue]
        TYPESAFE_API_KEY: !If [HasTypesafeApiKey, !Ref TypesafeApiKey, !Ref AWS::NoValue]
        TYPESAFE_MODEL: !If [HasTypesafeModel, !Ref TypesafeModel, !Ref AWS::NoValue]
        TYPESAFE_MIN_CONFIDENCE: !If [HasTypesafeMinConfidence, !Ref TypesafeMinConfidence, !Ref AWS::NoValue]
        TYPESAFE_ADVANCE_MIN_CONFIDENCE: !If [HasTypesafeAdvanceMinConfidence, !Ref TypesafeAdvanceMinConfidence, !Ref AWS::NoValue]
        TYPESAFE_GAME_OVER_MIN_CONFIDENCE: !If [HasTypesafeGameOverMinConfidence, !Ref TypesafeGameOverMinConfidence, !Ref AWS::NoValue]
        TYPESAFE_LOW_CONFIDENCE_FALLBACK: !If [HasTypesafeLowConfidenceFallback, !Ref TypesafeLowConfidenceFallback, !Ref AWS::NoValue]

  StaticBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub ${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-${EnvironmentName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-${EnvironmentName}-web-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${ProjectName}-${EnvironmentName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: 拡張子のない画面URLをindex.htmlへ解決する
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri !== "/" && request.uri.indexOf(".") === -1) {
            request.uri = "/index.html";
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref AWS::NoValue]
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        Origins:
          - Id: StaticOrigin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: ApiOrigin
            DomainName: !GetAtt AppWebFunctionEndpoint.DomainName
            OriginAccessControlId: !GetAtt ApiOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 45
        DefaultCacheBehavior:
          TargetOriginId: StaticOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${StaticBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
  StaticBucketName:
    Value: !Ref StaticBucket
  DistributionId:
    Value: !Ref Distribution
  TableName:
    Value: !Ref AppTable
  ApiEndpoint:
    Value: !Sub https://${Distribution.DomainName}
  FunctionArn:
    Value: !GetAtt AppWebFunction.FunctionArn
  EndpointArn:
    Value: !GetAtt AppWebFunctionEndpoint.EndpointArn
