<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>操作ガイド</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 28px 22px 72px; background: #f4f7fb; color: #182332; line-height: 1.75; }
      main { max-width: 38rem; margin: auto; }
      small { color: #567; font-weight: 700; }
      h1 { margin: 8px 0 16px; font-size: 1.55rem; line-height: 1.35; }
      p { margin: 0 0 18px; }
      a { display: inline-block; padding: 10px 15px; border-radius: 999px; background: #2768a8; color: #fff; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <small>XStoryPhone Browser</small>
      <h1>指定したHTMLを表示するタブ</h1>
      <p>このブラウザにはURL入力欄がありません。シナリオで許可したページだけを、同じタブの中で移動できます。</p>
      <a href="details.html">次のページを開く</a>
    </main>
  </body>
</html>
