<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ダミーデータ</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 32px 22px 72px; background: #eef3f8; color: #172433; }
      main { display: grid; gap: 14px; max-width: 36rem; margin: auto; }
      span { color: #52708d; font-size: .78rem; font-weight: 800; }
      h1, p { margin: 0; }
      h1 { font-size: 1.55rem; }
      p { line-height: 1.75; }
    </style>
  </head>
  <body>
    <main>
      <span>SCROLL TEST CONTENT</span>
      <h1>ダミーデータ</h1>
      <p>タブ一覧に項目が多い場合のスクロール動作を確認するための同一コンテンツです。</p>
    </main>
  </body>
</html>
